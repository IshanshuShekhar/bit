<svg width="600" height="850" viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg" style="background:#f7fafc; font-family:sans-serif;">
  <!-- Passport Border & Background -->
  <rect x="25" y="25" width="550" height="800" fill="#ffffff" stroke="#cbd5e0" stroke-width="2" rx="8"/>
  <rect x="35" y="35" width="530" height="780" fill="#fcfdfa" stroke="#4a5568" stroke-width="1.5" rx="6"/>

  <!-- Top Emblem & Country Header -->
  <rect x="35" y="35" width="530" height="95" fill="#1a365d" rx="6"/>
  <text x="300" y="70" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">REPUBLIC OF INDIA</text>
  <text x="300" y="92" font-size="13" fill="#cbd5e0" text-anchor="middle" letter-spacing="2">PASSPORT / PASSEPORT</text>
  <text x="300" y="112" font-size="11" fill="#bee3f8" text-anchor="middle">भारत गणराज्य</text>

  <!-- Type, Country Code, Passport No -->
  <rect x="55" y="145" width="490" height="42" fill="#edf2f7" stroke="#cbd5e0" rx="4"/>
  <text x="75" y="162" font-size="10" fill="#718096">Type / Type</text>
  <text x="75" y="178" font-size="13" font-weight="bold" fill="#2d3748">P</text>

  <text x="180" y="162" font-size="10" fill="#718096">Country Code / Code Pays</text>
  <text x="180" y="178" font-size="13" font-weight="bold" fill="#2d3748">IND</text>

  <text x="360" y="162" font-size="10" fill="#718096">Passport No. / No du Passeport</text>
  <text x="360" y="178" font-size="15" font-weight="bold" fill="#1a365d">Z5829104</text>

  <!-- Photo Box & Ghost Image -->
  <rect x="65" y="210" width="140" height="175" fill="#e2e8f0" stroke="#a0aec0" rx="4"/>
  <circle cx="135" cy="275" r="38" fill="#cbd5e0"/>
  <path d="M 90 360 C 90 320, 180 320, 180 360 Z" fill="#cbd5e0"/>
  <text x="135" y="380" font-size="10" fill="#718096" text-anchor="middle">HOLDER'S PHOTO</text>

  <!-- Biographical Data Fields -->
  <g transform="translate(230, 215)">
    <!-- Surname -->
    <text x="0" y="15" font-size="11" fill="#718096">Surname / Nom</text>
    <text x="0" y="35" font-size="18" font-weight="bold" fill="#1a202c">SHARMA</text>

    <!-- Given Names -->
    <text x="0" y="70" font-size="11" fill="#718096">Given Name(s) / Prénoms</text>
    <text x="0" y="90" font-size="18" font-weight="bold" fill="#1a202c">RAHUL</text>

    <!-- Nationality -->
    <text x="0" y="125" font-size="11" fill="#718096">Nationality / Nationalité</text>
    <text x="0" y="145" font-size="15" font-weight="bold" fill="#2d3748">INDIAN</text>

    <!-- Sex & DOB -->
    <text x="0" y="180" font-size="11" fill="#718096">Sex / Sexe: <tspan font-weight="bold" fill="#2d3748">M</tspan></text>
    <text x="120" y="180" font-size="11" fill="#718096">DOB: <tspan font-weight="bold" fill="#2d3748">15/08/2001</tspan></text>
  </g>

  <!-- Additional Data Lines -->
  <line x1="55" y1="410" x2="545" y2="410" stroke="#cbd5e0" stroke-width="1"/>

  <g transform="translate(65, 430)">
    <text x="0" y="15" font-size="11" fill="#718096">Place of Birth / Lieu de naissance</text>
    <text x="0" y="35" font-size="14" font-weight="bold" fill="#2d3748">TAMIL NADU, INDIA</text>

    <text x="260" y="15" font-size="11" fill="#718096">Place of Issue / Lieu de délivrance</text>
    <text x="260" y="35" font-size="14" font-weight="bold" fill="#2d3748">CHENNAI</text>

    <text x="0" y="75" font-size="11" fill="#718096">Date of Issue / Date de délivrance</text>
    <text x="0" y="95" font-size="14" font-weight="bold" fill="#2d3748">19/08/2022</text>

    <text x="260" y="75" font-size="11" fill="#718096">Date of Expiry / Date d'expiration</text>
    <text x="260" y="95" font-size="15" font-weight="bold" fill="#c53030">18/08/2032</text>
  </g>

  <!-- Security Hologram Badge -->
  <rect x="55" y="560" width="490" height="60" fill="#edf2f7" stroke="#e2e8f0" rx="4"/>
  <text x="300" y="595" font-size="12" fill="#718096" text-anchor="middle" font-style="italic">
    Republic of India • Government of India Passport Office • Verified Chip Document
  </text>

  <!-- Machine Readable Zone (MRZ) -->
  <rect x="45" y="650" width="510" height="135" fill="#f7fafc" stroke="#cbd5e0" rx="4"/>
  <text x="60" y="695" font-family="monospace" font-size="16" font-weight="bold" fill="#1a202c" letter-spacing="4">
    P&lt;INDSHARMA&lt;&lt;RAHUL&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;
  </text>
  <text x="60" y="745" font-family="monospace" font-size="16" font-weight="bold" fill="#1a202c" letter-spacing="4">
    Z5829104&lt;4IND0108153M3208188&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;4
  </text>
</svg>
